<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S3 Lab – Amazon S3 Simulator</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16191f;--mut:#687078;--bd:#d5dbdb;--ac:#3f8624;--er:#d13212;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#e9ebed;--mut:#9ba7b6;--bd:#333a45}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#e9ebed;--mut:#9ba7b6;--bd:#333a45}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
header{background:#232f3e;color:#fff;padding:12px 20px}header b{color:#7aa116;font-size:18px}
.wrap{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}
input,select{padding:7px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er)}
.bk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;margin:0 6px 6px 0;cursor:pointer}
.bk.on{border-color:var(--ac);background:rgba(63,134,36,.12)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:12px}
.mut{color:var(--mut)}.msg{padding:8px;border-radius:5px;margin-top:8px;background:rgba(63,134,36,.12)}.msg.e{background:rgba(209,50,18,.12)}
code{word-break:break-all}
</style></head><body>
<header><b>S3 Lab</b> &nbsp;<span style="color:#aab7c4">Amazon S3 simulator with pre-signed URLs</span></header>
<div class="wrap" id="app"></div>
<script>
let buckets={},cur=null,msg=null;
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
function say(t,e){msg={t,e};render()}
function mkBucket(){const n=document.getElementById('bn').value.trim();
 if(!/^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/.test(n))return say('Invalid name: 3-63 chars, lowercase letters, numbers, dots, hyphens.',1);
 if(buckets[n])return say('BucketAlreadyExists: name is taken (bucket names are globally unique).',1);
 buckets[n]={objs:{}};cur=n;say('Bucket "'+n+'" created.')}
function delBucket(n){if(Object.keys(buckets[n].objs).length)return say('BucketNotEmpty: delete all objects first.',1);delete buckets[n];cur=null;say('Bucket deleted.')}
function upload(files){const b=buckets[cur];for(const f of files){b.objs[f.name]={blob:f,size:f.size,type:f.type||'binary/octet-stream',mod:new Date(),cls:'STANDARD',acl:'private',ver:(b.objs[f.name]?b.objs[f.name].ver+1:1)}}
 say(files.length+' object(s) uploaded.')}
function del(k){delete buckets[cur].objs[k];say('Object deleted.')}
function dl(k){const o=buckets[cur].objs[k];if(o.acl!='public-read')return say('AccessDenied (403): object is private. Make it public or use a pre-signed URL.',1);
 const a=document.createElement('a');a.href=URL.createObjectURL(o.blob);a.download=k;a.click()}
function toggle(k){const o=buckets[cur].objs[k];o.acl=o.acl=='private'?'public-read':'private';render()}
function setCls(k,v){buckets[cur].objs[k].cls=v;render()}
let urls=[];
function presign(k){const s=+prompt('Expiry in seconds (e.g. 30)','30');if(!s||s<1)return;
 const o=buckets[cur].objs[k],exp=Date.now()+s*1000;
 urls.unshift({k,bucket:cur,exp,url:`https://${cur}.s3.ap-south-1.amazonaws.com/${encodeURIComponent(k)}?X-Amz-Expires=${s}&X-Amz-Signature=${Math.random().toString(16).slice(2,14)}`,blob:o.blob});say('Pre-signed URL generated.')}
function useUrl(i){const u=urls[i];if(Date.now()>u.exp)return say('403 Forbidden – Request has expired.',1);
 const a=document.createElement('a');a.href=URL.createObjectURL(u.blob);a.download=u.k;a.click();say('200 OK – object downloaded via pre-signed URL.')}
function render(){
 let h=`<div class="card"><h3>Buckets</h3>`+Object.keys(buckets).map(n=>`<span class="bk ${n==cur?'on':''}" onclick="cur='${n}';msg=null;render()">🪣 ${n}</span>`).join('')+
 `<div style="margin-top:8px"><input id="bn" placeholder="my-unique-bucket"> <button onclick="mkBucket()">Create bucket</button></div>`+
 (msg?`<div class="msg ${msg.e?'e':''}">${msg.t}</div>`:'')+`</div>`;
 if(cur&&buckets[cur]){const o=buckets[cur].objs,ks=Object.keys(o),tot=ks.reduce((a,k)=>a+o[k].size,0);
  const rate={STANDARD:0.023,'STANDARD_IA':0.0125,GLACIER:0.004};
  const cost=ks.reduce((a,k)=>a+o[k].size/1073741824*rate[o[k].cls],0);
  h+=`<div class="card"><h3>${cur} <span class="mut">· ${ks.length} objects · ${fmt(tot)}</span></h3>
  <input type="file" id="fi" multiple> <button onclick="fi.files.length&&upload(fi.files)">Upload</button> <button class="d" onclick="delBucket('${cur}')">Delete bucket</button>
  <div class="scroll" style="margin-top:10px"><table><tr><th>Key</th><th>Size</th><th>Modified</th><th>Storage class</th><th>Access</th><th>Actions</th></tr>`+
  (ks.length?ks.map(k=>`<tr><td>📄 ${k.replace(/</g,'&lt;')}</td><td>${fmt(o[k].size)}</td><td>${o[k].mod.toLocaleTimeString()}</td>
  <td><select onchange="setCls('${k.replace(/'/g,"\\'")}',this.value)">${Object.keys(rate).map(c=>`<option ${c==o[k].cls?'selected':''}>${c}</option>`).join('')}</select></td>
  <td><button class="s" onclick="toggle('${k.replace(/'/g,"\\'")}')">${o[k].acl}</button></td>
  <td><button class="s" onclick="dl('${k.replace(/'/g,"\\'")}')">Download</button> <button class="s" onclick="presign('${k.replace(/'/g,"\\'")}')">Pre-sign</button> <button class="d" onclick="del('${k.replace(/'/g,"\\'")}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="6" class="mut">No objects. Upload a file to begin.</td></tr>`)+
  `</table></div><p class="mut">Estimated storage cost: $${cost.toFixed(6)}/month (Standard $0.023, Standard-IA $0.0125, Glacier $0.004 per GB).</p></div>`}
 if(urls.length)h+=`<div class="card"><h3>Pre-signed URLs <span class="mut">(enhancement: time-limited access)</span></h3>`+urls.map((u,i)=>`<p><b>${u.k}</b> in ${u.bucket}<br><code>${u.url}</code><br><span class="mut">${Date.now()>u.exp?'Expired':'Expires in '+Math.ceil((u.exp-Date.now())/1000)+'s'}</span> <button class="s" onclick="useUrl(${i})">Open URL</button></p>`).join('')+`</div>`;
 h+=`<div class="card"><h3>About S3</h3><p class="mut">Amazon S3 stores data as <b>objects</b> (key + data + metadata) inside <b>buckets</b>. Bucket names are globally unique, objects are private by default, and access can be granted publicly or temporarily through <b>pre-signed URLs</b>. Storage classes trade price against access speed. This simulator keeps data in browser memory only.</p></div>`;
 document.getElementById('app').innerHTML=h}
setInterval(()=>{if(urls.length&&!document.querySelector('input:focus'))render()},1000);
render();
</script></body></html>
